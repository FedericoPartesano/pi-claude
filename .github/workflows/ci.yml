name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pi-claude-code, pi-team, pi-picker, pi-memory, pi-ui]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      # pi-ui's /img uses pi-picker's sources directly: its dependencies are needed to typecheck them.
      - if: matrix.package == 'pi-ui'
        run: npm ci --prefix ../pi-picker
      - run: npx tsc -p .
      - run: npm test

  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test extensions/*.test.ts
