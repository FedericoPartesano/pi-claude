<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Pi Desk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="browser-closed">
	<aside id="sidebar" aria-label="Sessioni">
		<div class="side-head"><span>Sessioni</span><button id="close-sidebar" class="icon" title="Chiudi">✕</button></div>
		<input id="session-filter" placeholder="Cerca per titolo o progetto" spellcheck="false">
		<div id="session-list"></div>
	</aside>

	<section id="chat">
		<header id="top">
			<button id="toggle-sessions" class="icon" title="Sessioni di Pi su questo PC">☰</button>
			<div class="logo">π</div>
			<div class="where"><b id="project-name">Pi Desk</b><span id="project-path"></span></div>
			<span id="status" class="pill">avvio…</span>
			<button id="toggle-browser" class="icon" title="Browser di Pi">◎</button>
			<button id="new-session" class="icon" title="Nuova sessione">＋</button>
		</header>
		<div id="viewer-bar" hidden><span class="dot"></span><span id="viewer-label"></span><button id="viewer-resume" hidden>Riprendi qui</button><button id="viewer-back">La mia chat</button></div>
		<div id="scroll">
			<div id="empty" class="thread">
				<div class="hello"><div class="logo big">π</div><h1>Di cosa hai bisogno?</h1><p>Pi lavora nella cartella del progetto, con le tue estensioni, la memoria e un browser che si apre con ◎ quando serve.</p>
				<div class="examples"><button>Riassumi lo stato del progetto</button><button>Trova i test che falliscono e sistemali</button><button>Apri nel browser localhost:3000 e prova il login</button><button>Cosa ricordi di questo progetto?</button></div></div>
			</div>
			<div id="log" class="thread" aria-live="polite"></div>
			<div id="viewer" class="thread" hidden></div>
		</div>
		<form id="composer">
			<div class="box">
				<textarea id="input" rows="1" placeholder="Chiedi a Pi…"></textarea>
				<div class="row"><span id="chips"></span><button type="button" id="stop" class="stop" hidden title="Interrompi (Esc)">■</button><button type="submit" id="send" class="send" title="Invia (Invio)">↑</button></div>
			</div>
			<div class="hint">Invio invia · Maiusc+Invio va a capo · Esc interrompe</div>
		</form>
		<div id="dialog" hidden><div class="box"><h3 id="dialog-title"></h3><p id="dialog-message"></p><div id="dialog-actions"></div></div></div>
	</section>

	<div id="splitter" title="Trascina per ridimensionare"></div>

	<section id="browser">
		<nav id="browserbar">
			<button id="back" class="icon" title="Indietro">←</button><button id="forward" class="icon" title="Avanti">→</button><button id="reload" class="icon" title="Ricarica">⟳</button>
			<div class="url"><span id="lock"></span><input id="url" spellcheck="false" placeholder="Indirizzo o ricerca"></div>
			<button id="close-browser" class="icon" title="Chiudi il browser">✕</button>
		</nav>
		<div id="browser-slot"><div class="slot-hint">Il browser di Pi</div></div>
	</section>
</div>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
