<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug di Pi</title>
<style>
/* Look ispirato a TailAdmin: sfondo grigio chiaro, card bianche arrotondate, blu #465fff, pill di stato. Nessuna risorsa esterna. */
:root{--bg:#f9fafb;--card:#fff;--line:#e4e7ec;--text:#101828;--mute:#667085;--soft:#f2f4f7;--brand:#465fff;--brand-soft:#ecf3ff;--ok:#12b76a;--ok-soft:#ecfdf3;--warn:#f79009;--warn-soft:#fffaeb;--err:#f04438;--err-soft:#fef3f2;--shadow:0 1px 2px rgba(16,24,40,.05)}
:root.dark{--bg:#0c111d;--card:#1d2939;--line:#344054;--text:#f2f4f7;--mute:#98a2b3;--soft:#101828;--brand:#7592ff;--brand-soft:#1b2a5c;--ok-soft:#053321;--warn-soft:#4e2a05;--err-soft:#55160c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:260px;background:var(--card);border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex:none}
.logo{font-size:20px;font-weight:700;padding:4px 12px 20px;display:flex;align-items:center;gap:10px}
.logo i{width:32px;height:32px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.menu-title{font-size:11px;letter-spacing:.12em;color:var(--mute);padding:12px 12px 6px;text-transform:uppercase}
.nav{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;color:var(--mute);cursor:pointer;border:0;background:none;font:inherit;text-align:left;width:100%}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav b{font-size:12px;background:var(--soft);color:var(--mute);border-radius:999px;padding:0 8px;font-weight:600}
.nav.on b{background:var(--card);color:var(--brand)}
.grow{flex:1}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header input{flex:1;max-width:420px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:9px 14px;font:inherit;outline:none}
header input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--err)}
.content{padding:24px 28px;display:flex;flex-direction:column;gap:24px}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat{padding:20px}
.stat small{color:var(--mute)}
.stat .n{font-size:30px;font-weight:700;margin-top:6px}
.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);font-size:20px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;padding:12px 20px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);background:var(--soft)}
td{padding:14px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
tr:last-child td{border-bottom:0}
.t{font-weight:600}
.m{color:var(--mute);font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.new{background:var(--brand-soft);color:var(--brand)}
.pill.resolved,.pill.fastidio{background:var(--ok-soft);color:var(--ok)}
.pill.blocca{background:var(--err-soft);color:var(--err)}
.pill.crash{background:var(--err-soft);color:var(--err)}
.pill.warn,.pill.rompe{background:var(--warn-soft);color:var(--warn)}
.pill.gray{background:var(--soft);color:var(--mute)}
.cardhead{padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.cardhead h2{font-size:16px;margin:0}
.empty{padding:48px;text-align:center;color:var(--mute)}
/* dettaglio */
#detail{display:none;flex-direction:column;gap:20px}
.crumb{color:var(--mute);cursor:pointer;width:max-content}
.crumb:hover{color:var(--brand)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:10px 16px;cursor:pointer;color:var(--mute);border:0;background:none;font:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.panel{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.kv{background:var(--soft);border-radius:12px;padding:12px 14px}
.kv small{color:var(--mute);display:block}
.kv span{word-break:break-word}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.box{background:var(--soft);border-radius:12px;padding:14px;margin-top:8px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:860px;border-radius:14px;padding:10px 14px;border:1px solid var(--line)}
.msg.user{background:var(--brand-soft);align-self:flex-end;border-color:transparent}
.msg.assistant{background:var(--card)}
.msg.tool{background:var(--soft);font-size:12px;color:var(--mute)}
.msg.note{background:var(--warn-soft);border-color:transparent}
.msg .who{font-size:11px;color:var(--mute);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.tool-call{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:8px;padding:6px 10px;margin-top:6px;word-break:break-all}
details summary{cursor:pointer;color:var(--mute)}
.task{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;display:none}
@media(max-width:860px){aside{display:none}}
</style>
</head>
<body>
<aside>
  <div class="logo"><i>🐞</i> Bug di Pi</div>
  <div class="menu-title">Filtri</div>
  <button class="nav on" data-f="all">Tutti <b id="c-all">0</b></button>
  <button class="nav" data-f="new">Nuovi <b id="c-new">0</b></button>
  <button class="nav" data-f="resolved">Risolti <b id="c-resolved">0</b></button>
  <button class="nav" data-f="blocca">Bloccanti <b id="c-blocca">0</b></button>
  <button class="nav" data-f="crash">Crash <b id="c-crash">0</b></button>
  <div class="grow"></div>
  <button class="btn" id="theme">☾ Tema scuro</button>
  <button class="btn danger" id="quit">Chiudi la pagina</button>
</aside>
<main>
  <header>
    <input id="q" placeholder="Cerca per titolo, gravità, nome…" autocomplete="off">
    <span class="grow"></span>
    <button class="btn" id="reload">↻ Aggiorna</button>
  </header>
  <div class="content" id="list">
    <div><h1>Bug ricevuti</h1><div class="sub">Quello che gli utenti hanno segnalato da <code>/bugreport</code>. Clicca una riga per leggere tutto.</div></div>
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="cardhead"><h2 id="listTitle">Tutti i bug</h2><span class="m" id="listCount"></span></div>
      <div id="tableWrap"></div>
    </div>
  </div>
  <div class="content" id="detail"></div>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
const KEY = "__KEY__";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return node;
};
// Tutto il testo dei pacchetti passa da textContent: i bug arrivano da altri computer, mai HTML preso così com'è.
async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: { "x-viewer-key": KEY, "content-type": "application/json" } });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || "errore " + response.status);
  return body;
}
function toast(text) { const t = $("toast"); t.textContent = text; t.style.display = "block"; setTimeout(() => (t.style.display = "none"), 2600); }

let bugs = [], filter = "all", query = "";
const when = (iso) => (iso ? new Date(iso).toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" }) : "");
const kb = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");
const isCrash = (b) => /crash/i.test(b.severity || "") || /^pi si è chiuso|crash/i.test(b.title || "");
const sevPill = (b) => el("span", { class: "pill " + (b.severity === "blocca" ? "blocca" : b.severity === "rompe" ? "rompe" : b.severity === "fastidio" ? "fastidio" : isCrash(b) ? "crash" : "gray") }, b.severity || "—");
const statusPill = (b) => el("span", { class: "pill " + (b.status === "resolved" ? "resolved" : "new") }, b.status === "resolved" ? "Risolto" : "Nuovo");

function visible() {
  const q = query.toLowerCase();
  return bugs.filter((b) => {
    if (filter === "new" && b.status === "resolved") return false;
    if (filter === "resolved" && b.status !== "resolved") return false;
    if (filter === "blocca" && b.severity !== "blocca") return false;
    if (filter === "crash" && !isCrash(b)) return false;
    return !q || `${b.title} ${b.severity} ${b.name} ${b.id}`.toLowerCase().includes(q);
  });
}

function renderList() {
  const count = (fn) => bugs.filter(fn).length;
  $("c-all").textContent = bugs.length;
  $("c-new").textContent = count((b) => b.status !== "resolved");
  $("c-resolved").textContent = count((b) => b.status === "resolved");
  $("c-blocca").textContent = count((b) => b.severity === "blocca");
  $("c-crash").textContent = count(isCrash);
  const stats = [["🐞", "Totali", bugs.length], ["🆕", "Da guardare", count((b) => b.status !== "resolved")], ["🔥", "Bloccanti aperti", count((b) => b.severity === "blocca" && b.status !== "resolved")], ["✅", "Risolti", count((b) => b.status === "resolved")]];
  $("stats").replaceChildren(...stats.map(([icon, label, n]) => el("div", { class: "card stat" }, el("div", { class: "ic" }, icon), el("small", {}, label), el("div", { class: "n" }, n))));
  const rows = visible();
  $("listTitle").textContent = { all: "Tutti i bug", new: "Bug nuovi", resolved: "Bug risolti", blocca: "Bug bloccanti", crash: "Crash" }[filter];
  $("listCount").textContent = rows.length + (rows.length === 1 ? " bug" : " bug");
  if (!rows.length) return $("tableWrap").replaceChildren(el("div", { class: "empty" }, bugs.length ? "Nessun bug con questo filtro." : "Nessun bug ricevuto."));
  const table = el("table", {}, el("thead", {}, el("tr", {}, ...["Bug", "Gravità", "Stato", "Ricevuto", "Peso"].map((h) => el("th", {}, h)))),
    el("tbody", {}, rows.map((b) => el("tr", { onclick: () => openBug(b) },
      el("td", {}, el("div", { class: "t" }, b.title || b.name || b.id), el("div", { class: "m" }, b.name || b.id)),
      el("td", {}, sevPill(b)), el("td", {}, statusPill(b)), el("td", {}, when(b.receivedAt)), el("td", {}, kb(b.size))))));
  $("tableWrap").replaceChildren(table);
}

async function load() {
  try { bugs = (await api("/api/bugs")).bugs; renderList(); }
  catch (error) { $("tableWrap").replaceChildren(el("div", { class: "empty" }, error.message)); }
}

// ---- dettaglio -------------------------------------------------------------------------------------------------
const pretty = (v) => (v === undefined || v === null ? "—" : typeof v === "string" ? v : JSON.stringify(v, null, 2));
const kv = (label, value) => el("div", { class: "kv" }, el("small", {}, label), el("span", {}, value === undefined || value === "" ? "—" : String(value)));

function tabForm(bug, pkg) {
  const r = pkg.report || {}, f = r.form || {}, x = r.extension || {};
  return el("div", { class: "panel" },
    el("div", { class: "grid" }, kv("Gravità", f.severity || bug.severity), kv("Tipo", f.kind === "crash" ? "Crash all'avvio" : "Bug segnalato"), kv("Segnalato il", when(r.reportedAt)),
      kv("Pi", r.pi), kv("pi-claude", [x.version, x.commit].filter(Boolean).join(" · ")), kv("Modello", r.model), kv("Sistema", [r.platform, r.node].filter(Boolean).join(" · ")), kv("Cartella", r.cwd)),
    el("h3", {}, "Cosa è successo"), el("div", { class: "box" }, el("pre", {}, f.happened || "—")),
    el("h3", {}, "Cosa si aspettava"), el("div", { class: "box" }, el("pre", {}, f.expected || "—")),
    r.crash ? [el("h3", {}, "Crash"), el("div", { class: "box" }, el("pre", {}, pretty(r.crash)))] : null,
    r.git ? [el("h3", {}, "Git"), el("div", { class: "box" }, el("pre", {}, pretty(r.git)))] : null,
    r.settings ? [el("h3", {}, "Impostazioni PI_*"), el("div", { class: "box" }, el("pre", {}, pretty(r.settings)))] : null);
}

function tabChat(pkg) {
  if (!pkg.conversation.length) return el("div", { class: "empty" }, "Nessuna conversazione nel pacchetto.");
  const label = { user: "Utente", assistant: "Pi", tool: "Risultato", note: "Nota" };
  return el("div", { class: "panel chat" },
    pkg.omitted ? el("div", { class: "m" }, `Mostrate le ultime ${pkg.conversation.length} voci, ${pkg.omitted} più vecchie omesse.`) : null,
    pkg.conversation.map((t) => {
      const body = t.role === "tool" ? el("details", {}, el("summary", {}, (t.toolName || "tool") + " · " + Math.min(t.text.length, 9999) + " caratteri"), el("pre", {}, t.text)) : el("pre", {}, t.text);
      return el("div", { class: "msg " + t.role }, el("div", { class: "who" }, label[t.role], t.at ? " · " + when(t.at) : ""), body,
        (t.tools || []).map((c) => el("div", { class: "tool-call" }, "▸ " + c.name + " " + c.args)));
    }));
}

function tabTodo(pkg) {
  const tasks = (pkg.todo && pkg.todo.tasks) || [];
  const mark = { completed: "✓", in_progress: "◐", pending: "○" };
  return el("div", { class: "panel" }, tasks.length ? tasks.filter((t) => t.status !== "deleted").map((t) => el("div", { class: "task" }, el("span", {}, mark[t.status] || "○"), el("span", {}, t.subject || ""))) : el("div", { class: "empty" }, "Nessun todo nel pacchetto."));
}

function tabNotes(pkg) {
  return el("div", { class: "panel" }, pkg.notes.length ? pkg.notes.map((n) => el("details", {}, el("summary", {}, n.name), el("div", { class: "box" }, el("pre", {}, n.text)))) : el("div", { class: "empty" }, "Nessuna memoria o intent nel pacchetto."));
}

function tabCrashes(pkg) {
  return el("div", { class: "panel" }, pkg.crashes ? el("div", { class: "box" }, el("pre", {}, pretty(pkg.crashes))) : el("div", { class: "empty" }, "Nessun crash recente."));
}

function tabFiles(pkg) {
  return el("div", { class: "panel" }, el("div", { class: "m" }, `Prompt di sistema: ${pkg.systemPromptChars} caratteri`),
    el("table", {}, el("tbody", {}, pkg.files.map((f) => el("tr", {}, el("td", {}, f.path), el("td", {}, kb(f.size)))))));
}

async function openBug(bug) {
  $("list").style.display = "none";
  const detail = $("detail");
  detail.style.display = "flex";
  detail.replaceChildren(el("div", { class: "crumb", onclick: closeBug }, "← Tutti i bug"), el("div", { class: "empty" }, "Scarico e leggo il pacchetto…"));
  let pkg;
  try { pkg = await api("/api/bugs/" + encodeURIComponent(bug.id)); }
  catch (error) { return detail.replaceChildren(el("div", { class: "crumb", onclick: closeBug }, "← Tutti i bug"), el("div", { class: "empty" }, error.message)); }
  const tabs = [["Modulo", () => tabForm(bug, pkg)], ["Conversazione", () => tabChat(pkg)], ["Todo", () => tabTodo(pkg)], ["Memoria e intent", () => tabNotes(pkg)], ["Crash", () => tabCrashes(pkg)], ["File", () => tabFiles(pkg)]];
  const body = el("div", { class: "card" });
  const bar = el("div", { class: "tabs" });
  const show = (i) => { [...bar.children].forEach((b, j) => b.classList.toggle("on", i === j)); body.replaceChildren(tabs[i][1]()); };
  tabs.forEach(([name], i) => bar.append(el("button", { class: "tab", onclick: () => show(i) }, name)));
  const toggle = el("button", { class: "btn primary", onclick: async () => {
    const next = bug.status === "resolved" ? "new" : "resolved";
    try { await api(`/api/bugs/${bug.id}/status`, { method: "POST", body: JSON.stringify({ status: next }) }); bug.status = next; toggle.textContent = next === "resolved" ? "Riapri" : "Segna come risolto"; head.replaceChildren(...headParts()); toast(next === "resolved" ? "Segnato come risolto" : "Riaperto"); }
    catch (error) { toast(error.message); }
  } }, bug.status === "resolved" ? "Riapri" : "Segna come risolto");
  const del = el("button", { class: "btn danger", onclick: async () => {
    if (!confirm("Eliminare questo bug dal database? Non si può annullare.")) return;
    try { await api("/api/bugs/" + bug.id, { method: "DELETE" }); bugs = bugs.filter((b) => b.id !== bug.id); toast("Eliminato"); closeBug(); }
    catch (error) { toast(error.message); }
  } }, "Elimina");
  const headParts = () => [el("div", {}, el("h1", {}, bug.title || bug.name || bug.id), el("div", { class: "sub" }, sevPill(bug), " ", statusPill(bug), " · ricevuto " + when(bug.receivedAt) + " · " + kb(bug.size))),
    el("div", { style: "display:flex;gap:8px" }, el("a", { class: "btn", href: `/api/bugs/${bug.id}/download?k=${KEY}`, onclick: (e) => { e.preventDefault(); download(bug); } }, "⬇ Scarica"), toggle, del)];
  const head = el("div", { style: "display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap" }, ...headParts());
  detail.replaceChildren(el("div", { class: "crumb", onclick: closeBug }, "← Tutti i bug"), head, bar, body);
  show(0);
}

async function download(bug) {
  const response = await fetch(`/api/bugs/${bug.id}/download`, { headers: { "x-viewer-key": KEY } });
  if (!response.ok) return toast("Scarico non riuscito");
  const link = el("a", { href: URL.createObjectURL(await response.blob()), download: (bug.name || "bug-" + bug.id) });
  link.click();
}

function closeBug() { $("detail").style.display = "none"; $("list").style.display = "flex"; renderList(); }

document.querySelectorAll(".nav").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; document.querySelectorAll(".nav").forEach((x) => x.classList.toggle("on", x === b)); closeBug(); }));
$("q").addEventListener("input", (e) => { query = e.target.value; renderList(); });
$("reload").addEventListener("click", load);
$("quit").addEventListener("click", async () => { try { await api("/api/quit", { method: "POST" }); } catch {} document.body.replaceChildren(el("div", { class: "empty", style: "margin:auto" }, "Pagina chiusa. Puoi chiudere questa scheda.")); });
const setTheme = (dark) => { document.documentElement.classList.toggle("dark", dark); $("theme").textContent = dark ? "☀ Tema chiaro" : "☾ Tema scuro"; try { localStorage.setItem("bugs-dark", dark ? "1" : "0"); } catch {} };
$("theme").addEventListener("click", () => setTheme(!document.documentElement.classList.contains("dark")));
try { setTheme(localStorage.getItem("bugs-dark") === "1"); } catch {}
load();
</script>
</body>
</html>
